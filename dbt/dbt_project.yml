name: usvi_tourism
version: "1.0.0"
config-version: 2
profile: usvi_tourism

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  usvi_tourism:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  usvi_tourism:
    +schema: reference

vars:
  # how far a reconciled total may drift from USVIBER's printed total (0.1%)
  reconcile_tolerance_pct: 0.1
